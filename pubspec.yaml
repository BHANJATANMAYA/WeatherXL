name: weatherxl
description: "Weather XL is a modern weather application that provides real-time weather updates with a clean, minimal, and user-friendly interface. The goal of this project is simple: fast, accurate weather info without unnecessary clutter."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lottie: ^3.3.1
  http: ^1.5.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0 
  flutter_native_splash: ^2.4.6
  flutter_dotenv: ^6.0.0

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Social Sign-in
  google_sign_in: ^6.2.1
  # sign_in_with_apple: ^6.1.0

  # Dependency Injection
  get_it: ^7.6.4

  # Local Storage for Session
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
    

  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true 
  adaptive_icon_background: "assets/splash_gradient.png"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_native_splash:
  android: true
  ios: true
  web: false
  background_image: "assets/splash_gradient.png"
  image: "assets/icon/weather_xl.png"

  
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages
flutter:

  uses-material-design: true
  
  

  # To add assets to your application, add an assets section, like this:
  assets:
  - assets/icon/
  - assets/splash_gradient.png
  - .env
  - assets/animations/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
